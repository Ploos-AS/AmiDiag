name: M4.2 FS-UAE qualification
# FROZEN after PASS run 35139348108, job 104939659463.
# Qualified source commit: 759f45fea2b74058c5ea5379a51876f7ee9b708e
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FS_UAE: xvfb-run -a fs-uae
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 759f45fea2b74058c5ea5379a51876f7ee9b708e
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-m68k-linux-gnu binutils-m68k-linux-gnu fs-uae xvfb python3
      - name: Build ROM
        run: |
          mkdir -p build
          m68k-linux-gnu-gcc -m68000 -msoft-float -ffreestanding -fno-builtin -nostdlib -c src/cia/m4_2_boot.S -o build/m4_2_boot.o
          m68k-linux-gnu-gcc -m68000 -nostdlib -Wl,-T,linker.ld -Wl,-Map,build/amidiag-m4_2.map build/m4_2_boot.o -o build/amidiag-m4_2.elf
          m68k-linux-gnu-objcopy -O binary build/amidiag-m4_2.elf build/amidiag-m4_2.rom
          truncate -s 524288 build/amidiag-m4_2.rom
          python3 tools/check_m4_2_rom.py build/amidiag-m4_2.rom
      - name: Qualify A500 68000
        run: AMIDIAG_SERIAL_PORT=1254 sh tools/run_fsuae_m4_2.sh build/amidiag-m4_2.rom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amidiag-m4_2-a500-68000
          path: build/
