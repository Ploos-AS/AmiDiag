name: M3.10c FS-UAE qualification
# Frozen after PASS: run 35086136881
# Qualified source: bb293f420ab03a404c631808e97f6ac61793207d
# Jobs: 68000=104761290258, 68010=104761290285, 68020=104761290289, 68030=104761290025
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cpu: [68000, 68010, 68020, 68030]
    env:
      FS_UAE: xvfb-run -a fs-uae
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb293f420ab03a404c631808e97f6ac61793207d
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-m68k-linux-gnu binutils-m68k-linux-gnu fs-uae xvfb python3
      - name: Build ROM
        run: |
          mkdir -p build
          m68k-linux-gnu-gcc -m68000 -msoft-float -ffreestanding -fno-builtin -nostdlib -c src/cpu/m3_10c_boot.S -o build/m3_10c_boot.o
          m68k-linux-gnu-gcc -m68000 -nostdlib -Wl,-T,linker.ld -Wl,-Map,build/amidiag-m3_10c.map build/m3_10c_boot.o -o build/amidiag-m3_10c.elf
          m68k-linux-gnu-objcopy -O binary build/amidiag-m3_10c.elf build/amidiag-m3_10c.rom
          truncate -s 524288 build/amidiag-m3_10c.rom
          python3 tools/check_m3_10c_rom.py build/amidiag-m3_10c.rom
      - name: Qualify CPU profile
        run: AMIDIAG_SERIAL_PORT=1252 sh tools/run_fsuae_m3_10c.sh '${{ matrix.cpu }}' build/amidiag-m3_10c.rom
      - name: Evidence
        if: always()
        run: |
          mkdir -p build/evidence
          sha256sum build/amidiag-m3_10c.rom > build/evidence/rom-sha256.txt 2>/dev/null || true
          fs-uae --version > build/evidence/fs-uae-version.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amidiag-m3_10c-${{ matrix.cpu }}
          path: build/
          if-no-files-found: warn
