name: M3.6 FS-UAE qualification (frozen)

# Historical qualification: run 34911637841, successful at
# 173148745426d0f05024d1e150e557ff732edb54.
# Manual replay intentionally checks out that exact qualified revision.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-m3-6:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CROSS: m68k-linux-gnu-
      FS_UAE: xvfb-run -a fs-uae
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 173148745426d0f05024d1e150e557ff732edb54
      - name: Install 68000 toolchain and FS-UAE
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-m68k-linux-gnu binutils-m68k-linux-gnu fs-uae xvfb python3
      - name: Qualify M3.6
        run: make clean qualify-m3_6
      - name: Record qualification evidence
        if: always()
        run: |
          mkdir -p build/evidence
          m68k-linux-gnu-gcc --version | head -n1 > build/evidence/toolchain.txt || true
          fs-uae --version > build/evidence/fs-uae-version.txt 2>&1 || true
          sha256sum build/amidiag-m3_6.rom > build/evidence/m3_6-rom-sha256.txt 2>/dev/null || true
      - name: Upload M3.6 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amidiag-m3_6-qualification
          path: |
            build/amidiag-m3_6.rom
            build/amidiag-m3_6.map
            build/m3_6-512-serial.txt
            build/m3_6-1024-serial.txt
            build/m3_6-512-fsuae.log
            build/m3_6-1024-fsuae.log
            build/m3_6-512.fs-uae
            build/m3_6-1024.fs-uae
            build/evidence/
          if-no-files-found: warn
