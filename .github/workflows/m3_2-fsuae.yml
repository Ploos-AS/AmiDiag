name: M3.2 FS-UAE qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-m3-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CROSS: m68k-linux-gnu-
      FS_UAE: xvfb-run -a fs-uae
    steps:
      - uses: actions/checkout@v4

      - name: Install 68000 toolchain and FS-UAE
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-m68k-linux-gnu binutils-m68k-linux-gnu fs-uae xvfb python3

      - name: Qualify M3.2
        run: make clean qualify-m3_2

      - name: Record qualification evidence
        if: always()
        run: |
          mkdir -p build/evidence
          m68k-linux-gnu-gcc --version | head -n1 > build/evidence/toolchain.txt || true
          fs-uae --version > build/evidence/fs-uae-version.txt 2>&1 || true
          sha256sum build/amidiag-m3_2.rom > build/evidence/m3_2-rom-sha256.txt 2>/dev/null || true

      - name: Upload M3.2 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amidiag-m3_2-qualification
          path: |
            build/amidiag-m3_2.rom
            build/amidiag-m3_2.map
            build/m3_2-serial.txt
            build/m3_2-fsuae.log
            build/m3_2.fs-uae
            build/evidence/
          if-no-files-found: warn
