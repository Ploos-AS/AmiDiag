name: M3.10a FS-UAE qualification
# Frozen after PASS: run 35031480310
# Qualified source: 2749585fece6961442a632cfee294487209b37c8
# Jobs: 68020=104590756232, 68000=104590756538
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cpu: [68000, 68020]
    env:
      FS_UAE: xvfb-run -a fs-uae
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2749585fece6961442a632cfee294487209b37c8
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-m68k-linux-gnu binutils-m68k-linux-gnu fs-uae xvfb python3
      - name: Build ROM
        run: |
          mkdir -p build
          m68k-linux-gnu-gcc -m68000 -msoft-float -ffreestanding -fno-builtin -nostdlib -c src/cpu/m3_10a_boot.S -o build/m3_10a_boot.o
          m68k-linux-gnu-gcc -m68000 -nostdlib -Wl,-T,linker.ld -Wl,-Map,build/amidiag-m3_10a.map build/m3_10a_boot.o -o build/amidiag-m3_10a.elf
          m68k-linux-gnu-objcopy -O binary build/amidiag-m3_10a.elf build/amidiag-m3_10a.rom
          truncate -s 524288 build/amidiag-m3_10a.rom
          python3 tools/check_m3_10a_rom.py build/amidiag-m3_10a.rom
      - name: Qualify CPU profile
        run: AMIDIAG_SERIAL_PORT=1250 sh tools/run_fsuae_m3_10a.sh '${{ matrix.cpu }}' build/amidiag-m3_10a.rom
      - name: Evidence
        if: always()
        run: |
          mkdir -p build/evidence
          sha256sum build/amidiag-m3_10a.rom > build/evidence/rom-sha256.txt 2>/dev/null || true
          fs-uae --version > build/evidence/fs-uae-version.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amidiag-m3_10a-${{ matrix.cpu }}
          path: build/
          if-no-files-found: warn
