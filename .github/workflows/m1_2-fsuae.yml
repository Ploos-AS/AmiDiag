name: M1.2 FS-UAE qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-m1-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CROSS: m68k-linux-gnu-
      FS_UAE: xvfb-run -a fs-uae
    steps:
      - uses: actions/checkout@v4
      - name: Historical milestone note
        run: |
          echo "M1.2 is frozen and retained for manual historical replay."
          echo "Current main has advanced to later milestones."
