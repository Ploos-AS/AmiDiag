name: M3.8 FS-UAE qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-m3-8:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FS_UAE: xvfb-run -a fs-uae
    steps:
      - uses: actions/checkout@v4
      - name: Install 68000 toolchain and FS-UAE
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-m68k-linux-gnu binutils-m68k-linux-gnu fs-uae xvfb python3
      - name: Build M3.8 ROM
        run: |
          mkdir -p build
          m68k-linux-gnu-gcc -m68000 -msoft-float -ffreestanding -fno-builtin -nostdlib -Wall -Wextra -c src/cpu/m3_8_boot.S -o build/m3_8_boot.o
          m68k-linux-gnu-gcc -m68000 -msoft-float -ffreestanding -fno-builtin -nostdlib -Wall -Wextra -nostdlib -Wl,-T,linker.ld -Wl,-Map,build/amidiag-m3_8.map build/m3_8_boot.o -o build/amidiag-m3_8.elf
          m68k-linux-gnu-objcopy -O binary build/amidiag-m3_8.elf build/amidiag-m3_8.rom
          truncate -s 524288 build/amidiag-m3_8.rom
          python3 tools/check_m3_8_rom.py build/amidiag-m3_8.rom
      - name: Qualify 68000 instruction sanity
        run: AMIDIAG_SERIAL_PORT=1248 sh tools/run_fsuae_m3_8.sh build/amidiag-m3_8.rom build/m3_8-serial.txt
      - name: Record evidence
        if: always()
        run: |
          mkdir -p build/evidence
          m68k-linux-gnu-gcc --version | head -n1 > build/evidence/toolchain.txt || true
          fs-uae --version > build/evidence/fs-uae-version.txt 2>&1 || true
          sha256sum build/amidiag-m3_8.rom > build/evidence/m3_8-rom-sha256.txt 2>/dev/null || true
      - name: Upload M3.8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amidiag-m3_8-qualification
          path: |
            build/amidiag-m3_8.rom
            build/amidiag-m3_8.map
            build/m3_8-*
            build/evidence/
          if-no-files-found: warn
